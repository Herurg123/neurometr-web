name: B3.1 Offline Catalog Snapshot CI
on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'scripts/catalog_*.py'
      - '.github/workflows/catalog-b31-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned canonical validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1' 'rfc3339-validator==0.1.4'
      - name: Canonical v0.1.0 tests
        run: python -m unittest discover -s contracts/tests -p 'test_*.py' -v
      - name: B3.1 snapshot/provenance/integrity negative tests (offline)
        run: python -m unittest discover -s catalog/tests -p 'test_*.py' -v
      - name: Exact snapshot and manifest byte counts and hashes
        run: |
          sha256sum catalog/versions/2026.11.11.2/catalog.json
          wc -c catalog/versions/2026.11.11.2/catalog.json
          sha256sum catalog/manifests/2026.11.11.2/manifest.json
          wc -c catalog/manifests/2026.11.11.2/manifest.json
      - name: Summary
        if: always()
        run: |
          echo '## B3.1 Base Offline Catalog' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source: pinned official Qwen metadata; no GGUF weight downloads.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Snapshot/manifest integrity and negative tests run offline.' >> "$GITHUB_STEP_SUMMARY"
          echo 'UNSIGNED manifest, not a trusted remote release. No deploy, keys, latest pointer or Agent changes.' >> "$GITHUB_STEP_SUMMARY"
