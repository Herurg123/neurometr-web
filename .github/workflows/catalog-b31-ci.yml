name: B3.1 Offline Catalog Snapshot CI
on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'scripts/catalog_*.py'
      - '.github/workflows/catalog-b31-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned canonical JSON Schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1' 'rfc3339-validator==0.1.4'
      - name: Re-run approved Contract v0.1.0 tests
        run: python -m unittest discover -s contracts/tests -p 'test_*.py' -v
      - name: Snapshot exact bytes and sha256 (no network)
        run: |
          sha256sum catalog/versions/2026.11.11.2/catalog.json
          wc -c catalog/versions/2026.11.11.2/catalog.json
      - name: Report metadata-only stage
        run: |
          echo '## B3.1 offline catalog research' >> "$GITHUB_STEP_SUMMARY"
          echo 'Immutable candidate v2026.11.11.2; unsigned, not a remote release.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Snapshot hash/bytes above are authoritative for exact repository bytes.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No GGUF downloads, inference, remote updates, deployments or secrets.' >> "$GITHUB_STEP_SUMMARY"
