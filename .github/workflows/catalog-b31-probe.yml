name: B3.1 Official Metadata Probe (one-time research)
on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'scripts/catalog_probe.py'
      - '.github/workflows/catalog-b31-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-official-model-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Query only official HF JSON metadata and small README/LICENSE
        run: python scripts/catalog_probe.py
      - name: Attach small provenance research metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b31-official-metadata-research
          path: catalog/research/official-metadata.json
          if-no-files-found: error
          retention-days: 7
