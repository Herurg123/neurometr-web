name: Contract CI
on:
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/contract-ci.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Validate Draft 2020-12 contracts and fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned B1 validator
        run: |
          python -m pip install --disable-pip-version-check 'jsonschema==4.25.1' 'rfc3339-validator==0.1.4'
      - name: Run contract and security tests
        run: |
          python -m unittest discover -s contracts/tests -p 'test_*.py' -v
      - name: Report context
        if: always()
        run: |
          echo "## Neurometr B1 Contract CI" >> "$GITHUB_STEP_SUMMARY"
          echo "Revision: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Schema baseline: v0.1.0; JSON Schema Draft 2020-12" >> "$GITHUB_STEP_SUMMARY"
          echo "No frontend build, Agent tests, Ed25519 crypto or remote catalog updates executed." >> "$GITHUB_STEP_SUMMARY"
