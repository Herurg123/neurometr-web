name: Web B2 CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - 'index.html'
      - '.github/workflows/web-b2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Validate, build, browser smoke and screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify committed lockfile
        run: test -f package-lock.json
      - name: Install exact resolved dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit and fixture tests
        run: npm run test
      - name: Static production build
        run: npm run build
      - name: Assert complete two-page production dist for QA
        run: |
          test -s dist/index.html
          test -s dist/viewer.html
          test -s dist/favicon.ico
          test -s dist/favicon.svg
          # Vite base './' rewrites root asset references to relative URLs.
          grep -Fq 'favicon.ico' dist/index.html
          grep -Fq 'favicon.ico' dist/viewer.html
          grep -Fq 'favicon.svg' dist/index.html
          grep -Fq 'favicon.svg' dist/viewer.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
          echo "QA_FULL_STATIC_DIST=PASS"
      - name: Check existing browser (no Chromium download)
        run: |
          which google-chrome || which google-chrome-stable
          google-chrome --version || google-chrome-stable --version
      - name: Browser integration tests and screenshot
        run: npm run test:browser
      - name: Upload complete dist for production QA comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neurometr-pr6-complete-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error
      - name: Collect static build and review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b2-static-viewer-evidence
          path: |
            dist/
            package-lock.json
            artifacts/
            test-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Job summary
        if: always()
        run: |
          echo '## Neurometr Web B2' >> "$GITHUB_STEP_SUMMARY"
          echo "Head: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Contract: diagnostic v0.1.0, unmodified' >> "$GITHUB_STEP_SUMMARY"
          echo 'Cloud-only: GitHub-hosted Ubuntu runner, no deploy, no secrets.' >> "$GITHUB_STEP_SUMMARY"
