name: Web B3.2 Real Agent to Browser E2E
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/b32_private_windows.py'
      - 'docs/B3_2_REAL_AGENT_E2E.md'
      - '.github/workflows/web-b32-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  web-regression:
    name: Contract, catalog, frontend and synthetic browser regression
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout Web
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1' 'rfc3339-validator==0.1.4'
      - name: Canonical contract v0.1.0 regression
        run: python -m unittest discover -s contracts/tests -p 'test_*.py' -v
      - name: Offline catalog regression
        run: python -m unittest discover -s catalog/tests -p 'test_*.py' -v
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned Web dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm run test
      - name: Static build
        run: npm run build
      - name: Check installed Chrome
        run: |
          which google-chrome || which google-chrome-stable
          google-chrome --version || google-chrome-stable --version
      - name: Synthetic-only Playwright browser regression
        run: npm run test:browser

  private-real-windows-e2e:
    name: Windows 2025 native Agent ordinary JSON to Chromium File API
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout Web feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout immutable Agent source read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Herurg123/neurometr-agent
          ref: f63d38fa8018572f570d60f6bf652ee2bb7e64c3
          path: agent-readonly
          persist-credentials: false
      - name: Go from Agent go.mod
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: agent-readonly/go.mod
          cache: false
      - name: Python 3.12 for independent Web schema validation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Static build before private diagnostic exists
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install pinned Python validator
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "jsonschema==4.25.1" "rfc3339-validator==0.1.4"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Real Windows ordinary A3.3 export and dual Go/Python validation (redacted)
        shell: pwsh
        run: |
          python scripts/b32_private_windows.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Real private report Chromium File API (no artifacts)
        shell: pwsh
        run: |
          node tests/e2e/b32-real-agent-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Always erase temporary private report and build tools
        if: always()
        shell: pwsh
        run: |
          $private = Join-Path $env:RUNNER_TEMP "neurometr-b32-private"
          if (Test-Path -LiteralPath $private) {
            Remove-Item -LiteralPath $private -Force -Recurse -ErrorAction Stop
          }
          if (Test-Path -LiteralPath $private) { exit 1 }
          Write-Output "B32_PRIVATE_TEMP_REMOVED=PASS"
# No upload-artifact, screenshots, trace, video or raw report output in Windows job.
